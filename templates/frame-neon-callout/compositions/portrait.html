<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Neon Callout · Portrait 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root {
    --bg-primary: #030712;
    --bg-secondary: #111827;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.5);
    --accent-1: #22d3ee;
    --accent-2: #a855f7;
    --blob-1: #0e7490;
    --blob-2: #7c3aed;
    --blob-3: #0891b2;

    position: relative; width: 1080px; height: 1920px;
    font-family: "Be Vietnam Pro", sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-primary);
    color: var(--text-primary);
  }

  /* Grid background */
  .grid-bg {
    position: absolute; inset: 0; z-index: 0; opacity: 0.08;
    background-image: 
      linear-gradient(var(--accent-1) 1px, transparent 1px),
      linear-gradient(90deg, var(--accent-1) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }

  /* Ambient glow */
  .glow-orb {
    position: absolute; border-radius: 50%; z-index: 1; filter: blur(120px); opacity: 0.3;
  }
  .glow-1 { width: 600px; height: 600px; top: 25%; left: 15%; background: var(--accent-1); }
  .glow-2 { width: 500px; height: 500px; bottom: 20%; right: 10%; background: var(--accent-2); }

  /* Neon card */
  .neon-card {
    position: relative; z-index: 5;
    width: 880px; padding: 80px 70px;
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--accent-1);
    border-radius: 36px;
    box-shadow: 
      0 0 30px color-mix(in srgb, var(--accent-1) 30%, transparent),
      0 0 60px color-mix(in srgb, var(--accent-1) 15%, transparent),
      inset 0 1px 0 rgba(255,255,255,0.1);
    opacity: 0; transform: translateY(40px);
    animation: cardFloat 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }
  @keyframes cardFloat { to { opacity: 1; transform: translateY(0); } }

  /* Neon pulse on border */
  .neon-card::before {
    content: ''; position: absolute; inset: -3px; border-radius: 38px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-1));
    background-size: 300% 300%;
    z-index: -1; opacity: 0.6;
    animation: neonPulse 4s ease-in-out infinite;
    filter: blur(4px);
  }
  @keyframes neonPulse {
    0%, 100% { background-position: 0% 50%; opacity: 0.4; }
    50% { background-position: 100% 50%; opacity: 0.8; }
  }

  /* Icon */
  .callout-icon {
    font-size: 120px; text-align: center; margin-bottom: 40px;
    filter: drop-shadow(0 0 30px var(--accent-1));
    opacity: 0; transform: scale(0.5);
    animation: iconBounce 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards;
  }
  @keyframes iconBounce { to { opacity: 1; transform: scale(1); } }

  /* Title */
  .callout-title {
    font-size: 56px; font-weight: 800; text-align: center; line-height: 1.2;
    margin-bottom: 30px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity: 0; animation: fadeUp 0.7s ease-out 0.9s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* Body */
  .callout-body {
    font-size: 36px; font-weight: 400; text-align: center; line-height: 1.55;
    color: var(--text-secondary);
    opacity: 0; animation: fadeUp 0.7s ease-out 1.1s forwards;
  }

  /* Footer */
  .callout-footer {
    margin-top: 50px; text-align: center;
    font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent-1); opacity: 0.6;
    opacity: 0; animation: fadeUp 0.5s ease-out 1.3s forwards;
  }

  /* Decorative corners */
  .corner { position: absolute; width: 40px; height: 40px; z-index: 6; }
  .corner-tl { top: 15px; left: 15px; border-top: 3px solid var(--accent-1); border-left: 3px solid var(--accent-1); }
  .corner-tr { top: 15px; right: 15px; border-top: 3px solid var(--accent-1); border-right: 3px solid var(--accent-1); }
  .corner-bl { bottom: 15px; left: 15px; border-bottom: 3px solid var(--accent-2); border-left: 3px solid var(--accent-2); }
  .corner-br { bottom: 15px; right: 15px; border-bottom: 3px solid var(--accent-2); border-right: 3px solid var(--accent-2); }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"icon":"💡","title":"Bạn có biết?","body":"90% người thành công đều có thói quen đọc sách mỗi ngày. Thay vì lướt TikTok 2 tiếng, hãy dành 30 phút cho một cuốn sách.","footer":"KIẾN THỨC LÀ SỨC MẠNH"}'
  >
    <div class="grid-bg"></div>
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="neon-card">
      <div class="callout-icon"></div>
      <div class="callout-title"></div>
      <div class="callout-body"></div>
      <div class="callout-footer"></div>
    </div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") ? window.__hyperframes.getVariables() : {};

      var _t = v.__theme || {};
      var _r = document.getElementById('root');
      var _sv = function(n, val) { if (val) _r.style.setProperty(n, val); };
      _sv('--bg-primary', _t.bgPrimary);
      _sv('--bg-secondary', _t.bgSecondary);
      _sv('--text-primary', _t.textPrimary);
      _sv('--text-secondary', _t.textSecondary);
      _sv('--accent-1', _t.accent1);
      _sv('--accent-2', _t.accent2);
      _sv('--blob-1', _t.blob1);
      _sv('--blob-2', _t.blob2);
      _sv('--blob-3', _t.blob3);

      var setText = function(sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };

      setText(".callout-icon", v.icon);
      setText(".callout-title", v.title);
      setText(".callout-body", v.body);
      
      var footerEl = document.querySelector(".callout-footer");
      if (v.footer) { footerEl.textContent = v.footer; } else { footerEl.style.display = 'none'; }
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>
