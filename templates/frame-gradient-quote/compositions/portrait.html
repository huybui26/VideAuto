<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Gradient Quote · Portrait 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root {
    --bg-primary: #0f0c29;
    --bg-secondary: #302b63;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.6);
    --accent-1: #a855f7;
    --accent-2: #ec4899;
    --blob-1: #7c3aed;
    --blob-2: #db2777;
    --blob-3: #6366f1;

    position: relative; width: 1080px; height: 1920px;
    font-family: "Be Vietnam Pro", sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-primary);
  }

  /* Animated gradient background */
  .gradient-bg {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(135deg, var(--blob-1), var(--blob-2), var(--blob-3), var(--accent-1));
    background-size: 400% 400%;
    animation: gradientShift 8s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Frosted noise overlay */
  .noise {
    position: absolute; inset: 0; z-index: 1; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Floating orbs */
  .orb {
    position: absolute; border-radius: 50%; z-index: 1; filter: blur(80px); opacity: 0.5;
  }
  .orb-1 { width: 500px; height: 500px; top: 10%; left: -10%; background: var(--accent-1); animation: orbFloat1 12s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; bottom: 15%; right: -5%; background: var(--accent-2); animation: orbFloat2 10s ease-in-out infinite; }
  .orb-3 { width: 300px; height: 300px; top: 45%; left: 40%; background: var(--blob-3); animation: orbFloat3 14s ease-in-out infinite; }
  @keyframes orbFloat1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
  @keyframes orbFloat2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px, -80px); } }
  @keyframes orbFloat3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px, 50px) scale(1.2); } }

  /* Glassmorphism card */
  .glass-card {
    position: relative; z-index: 5;
    width: 900px; padding: 80px 70px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    opacity: 0; transform: translateY(40px) scale(0.96);
    animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Quote mark */
  .quote-mark {
    font-size: 200px; font-weight: 900; line-height: 0.7;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity: 0.4; margin-bottom: 20px;
    animation: quoteMarkIn 0.8s ease-out 0.6s both;
  }
  @keyframes quoteMarkIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 0.4; transform: scale(1); } }

  /* Quote text */
  .quote-text {
    font-size: 58px; font-weight: 700; line-height: 1.35;
    color: var(--text-primary); letter-spacing: -0.5px;
    margin-bottom: 50px;
    opacity: 0; animation: textIn 0.8s ease-out 0.8s forwards;
  }
  @keyframes textIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* Divider */
  .divider {
    width: 100px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    margin-bottom: 40px;
    opacity: 0; animation: dividerIn 0.6s ease-out 1.1s forwards;
  }
  @keyframes dividerIn { from { opacity: 0; width: 0; } to { opacity: 1; width: 100px; } }

  /* Author */
  .author {
    font-size: 32px; font-weight: 600; color: var(--text-secondary); letter-spacing: 1px;
    opacity: 0; animation: textIn 0.6s ease-out 1.3s forwards;
  }

  /* Tag */
  .tag {
    position: absolute; top: -30px; right: 60px;
    padding: 14px 32px; border-radius: 999px;
    font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 8px 30px rgba(168,85,247,0.4);
    opacity: 0; transform: translateY(10px);
    animation: tagIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
  }
  @keyframes tagIn { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"quote":"Đừng sợ thất bại. Hãy sợ những gì bạn bỏ lỡ khi không thử.","author":"— Khuyết danh","tag":"💡 Bài học"}'
  >
    <div class="gradient-bg"></div>
    <div class="noise"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="glass-card">
      <div class="tag"></div>
      <div class="quote-mark">"</div>
      <div class="quote-text"></div>
      <div class="divider"></div>
      <div class="author"></div>
    </div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") ? window.__hyperframes.getVariables() : {};

      // ── Theme Applicator ──
      var _t = v.__theme || {};
      var _r = document.getElementById('root');
      var _sv = function(n, val) { if (val) _r.style.setProperty(n, val); };
      _sv('--bg-primary', _t.bgPrimary);
      _sv('--bg-secondary', _t.bgSecondary);
      _sv('--text-primary', _t.textPrimary);
      _sv('--text-secondary', _t.textSecondary);
      _sv('--accent-1', _t.accent1);
      _sv('--accent-2', _t.accent2);
      _sv('--blob-1', _t.blob1);
      _sv('--blob-2', _t.blob2);
      _sv('--blob-3', _t.blob3);

      var setText = function(sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };

      setText(".quote-text", v.quote);
      setText(".author", v.author);
      
      var tagEl = document.querySelector(".tag");
      if (v.tag) { tagEl.textContent = v.tag; } else { tagEl.style.display = 'none'; }
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>
