<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Alert Stat · Portrait 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #080808; }
  #root {

                /* Theme defaults */
                --bg-primary: #020c1a;
                --bg-secondary: #0a1628;
                --text-primary: #fafaf8;
                --text-secondary: rgba(250,250,248,0.55);
                --accent-1: #ff4d6d;
                --accent-2: #5ce1e6;
                --blob-1: #1565c0;
                --blob-2: #0d47a1;
                --blob-3: #1976d2;

    position: relative; width: 1080px; height: 1920px; 
    background: #080808; color: #ffffff;
    font-family: "Be Vietnam Pro", sans-serif; overflow: hidden;
    padding: 200px 80px;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes widthGrow { from { width: 0; } to { width: var(--w); } }

  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 50px; }
  .top-left { font-size: 28px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 2px; max-width: 500px; line-height: 1.4; opacity: 0; animation: fadeUp 0.6s ease-out 0.2s both; }
  .top-right { font-size: 110px; font-weight: 900; color: #ff3333; letter-spacing: -1px; line-height: 0.9; opacity: 0; animation: slideInRight 0.6s cubic-bezier(0.16,1,0.3,1) 0.3s both; text-shadow: 0 0 40px rgba(255,51,51,0.4); }

  .divider { display: flex; align-items: center; gap: 20px; margin-bottom: 60px; opacity: 0; animation: fadeUp 0.6s ease-out 0.5s both; }
  .divider-line { width: 50px; height: 4px; background: #ff3333; }
  .divider-text { font-size: 26px; font-weight: 700; color: #ff3333; letter-spacing: 3px; text-transform: uppercase; }

  .headline { font-size: 85px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 60px; opacity: 0; animation: fadeUp 0.6s ease-out 0.7s both; }

  .badge { display: inline-flex; align-items: center; background: #ff3333; color: #ffffff; padding: 12px 30px; border-radius: 999px; font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 60px; opacity: 0; animation: fadeUp 0.6s ease-out 0.9s both; box-shadow: 0 10px 30px rgba(255,51,51,0.4); }
  .badge::before { content: '↓'; margin-right: 12px; }

  .stat-row { display: flex; align-items: baseline; gap: 20px; margin-bottom: 40px; opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 1.1s both; }
  .stat-value { font-size: 340px; font-weight: 900; color: #ff3333; letter-spacing: -12px; line-height: 0.75; text-shadow: 0 0 60px rgba(255,51,51,0.3); }
  .stat-unit { font-size: 50px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 2px; }

  .sub-badge { display: inline-flex; align-items: center; background: #ff3333; color: #ffffff; padding: 14px 40px; border-radius: 999px; font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 50px; opacity: 0; animation: fadeUp 0.6s ease-out 1.3s both; }
  .sub-badge::before { content: '↓'; margin-right: 12px; }

  .progress-container { margin-bottom: 20px; opacity: 0; animation: fadeUp 0.6s ease-out 1.5s both; }
  .progress-label { font-size: 40px; font-weight: 900; color: #ffffff; margin-bottom: 15px; }
  .progress-track { width: 100%; height: 60px; display: flex; background: repeating-linear-gradient(45deg, rgba(255,51,51,0.1), rgba(255,51,51,0.1) 10px, transparent 10px, transparent 20px); border: 2px solid rgba(255,51,51,0.2); }
  .progress-fill { height: 100%; background: #ff3333; box-shadow: 0 0 30px rgba(255,51,51,0.5); --w: 30%; width: 0; animation: widthGrow 1s cubic-bezier(0.16,1,0.3,1) 1.8s forwards; }

</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"top_left":"UET - CÔNG NGHỆ THÔNG TIN","top_right":"-3,19","divider_text":"NGAY TRONG HÔM NAY","headline":"HỌC VIỆN CÔNG NGHỆ BƯU CHÍNH VIỄN THÔNG","badge":"PTIT","stat_value":"23","stat_unit":"ĐIỂM","sub_badge":"CHỈ CÒN ĐÚNG 23 ĐIỂM","progress_percent":30}'
  >
    <div class="top-row">
      <div class="top-left"></div>
      <div class="top-right"></div>
    </div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text"></div>
    </div>
    <h1 class="headline"></h1>
    <div class="badge-wrapper"><div class="badge"></div></div>
    <div class="stat-row">
      <div class="stat-value"></div>
      <div class="stat-unit"></div>
    </div>
    <div class="sub-badge-wrapper"><div class="sub-badge"></div></div>
    
    <div class="progress-container">
      <div class="progress-label"></div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") ? window.__hyperframes.getVariables() : {};
      

                // ── Theme Applicator ──
                var _t = v.__theme || {};
                var _r = document.getElementById('root');
                var _sv = function(n, val) { if (val) _r.style.setProperty(n, val); };
                _sv('--bg-primary', _t.bgPrimary);
                _sv('--bg-secondary', _t.bgSecondary);
                _sv('--text-primary', _t.textPrimary);
                _sv('--text-secondary', _t.textSecondary);
                _sv('--accent-1', _t.accent1);
                _sv('--accent-2', _t.accent2);
                _sv('--blob-1', _t.blob1);
                _sv('--blob-2', _t.blob2);
                _sv('--blob-3', _t.blob3);
      var set = function (sel, text, parentSelToHide) {
        var el = document.querySelector(sel);
        if (el) {
          if (text) { el.textContent = String(text); } 
          else if (parentSelToHide) { document.querySelector(parentSelToHide).style.display = 'none'; }
          else { el.style.display = 'none'; }
        }
      };

      set(".top-left", v.top_left);
      set(".top-right", v.top_right);
      
      var divText = document.querySelector(".divider-text");
      if (v.divider_text) { divText.textContent = v.divider_text; } else { document.querySelector(".divider").style.display = 'none'; }

      set(".headline", v.headline);
      set(".badge", v.badge, ".badge-wrapper");
      set(".stat-value", v.stat_value);
      set(".stat-unit", v.stat_unit);
      set(".sub-badge", v.sub_badge, ".sub-badge-wrapper");

      var pCont = document.querySelector(".progress-container");
      if (v.stat_value && v.progress_percent != null) {
        document.querySelector(".progress-label").textContent = String(v.stat_value);
        document.querySelector(".progress-fill").style.setProperty('--w', Math.max(0, Math.min(100, Number(v.progress_percent))) + '%');
      } else {
        pCont.style.display = 'none';
      }

    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>
