<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Timeline Step · Portrait 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #1a1a1a;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.5);
    --accent-1: #10b981;
    --accent-2: #34d399;
    --blob-1: #065f46;
    --blob-2: #047857;
    --blob-3: #059669;

    position: relative; width: 1080px; height: 1920px;
    font-family: "Be Vietnam Pro", sans-serif; overflow: hidden;
    background: var(--bg-primary); color: var(--text-primary);
  }

  /* Subtle radial glow */
  .ambient {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 30% 40%, color-mix(in srgb, var(--accent-1) 12%, transparent) 0%, transparent 60%);
  }

  /* Title area */
  .title-area {
    position: relative; z-index: 5; padding: 120px 80px 50px;
  }
  .title-kicker {
    font-size: 26px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent-1); margin-bottom: 20px;
    opacity: 0; animation: fadeDown 0.6s ease-out 0.2s forwards;
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

  .title-text {
    font-size: 64px; font-weight: 800; line-height: 1.2;
    opacity: 0; animation: fadeDown 0.7s ease-out 0.4s forwards;
  }

  /* Timeline container */
  .timeline {
    position: relative; z-index: 5;
    padding: 40px 80px 80px 130px;
  }

  /* Vertical line */
  .timeline::before {
    content: ''; position: absolute; left: 108px; top: 40px; bottom: 80px;
    width: 4px; background: linear-gradient(180deg, var(--accent-1), var(--accent-2), transparent);
    border-radius: 2px;
    transform: scaleY(0); transform-origin: top;
    animation: lineReveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }
  @keyframes lineReveal { to { transform: scaleY(1); } }

  /* Step item */
  .step {
    position: relative; padding: 0 0 55px 60px;
    opacity: 0; transform: translateX(-20px);
  }
  .step:nth-child(1) { animation: stepIn 0.6s ease-out 0.8s forwards; }
  .step:nth-child(2) { animation: stepIn 0.6s ease-out 1.1s forwards; }
  .step:nth-child(3) { animation: stepIn 0.6s ease-out 1.4s forwards; }
  .step:nth-child(4) { animation: stepIn 0.6s ease-out 1.7s forwards; }
  @keyframes stepIn { to { opacity: 1; transform: translateX(0); } }

  /* Dot on timeline */
  .step-dot {
    position: absolute; left: -38px; top: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-1);
    border: 4px solid var(--bg-primary);
    box-shadow: 0 0 20px var(--accent-1);
  }
  .step.done .step-dot { background: var(--accent-2); box-shadow: 0 0 20px var(--accent-2); }
  .step.active .step-dot { 
    background: var(--accent-1);
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { box-shadow: 0 0 20px var(--accent-1); } 50% { box-shadow: 0 0 40px var(--accent-1), 0 0 60px var(--accent-1); } }

  .step-label {
    font-size: 30px; font-weight: 700; margin-bottom: 10px; color: var(--accent-1);
  }
  .step-desc {
    font-size: 32px; font-weight: 400; line-height: 1.4; color: var(--text-secondary);
  }
  .step-badge {
    display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 999px;
    font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  }
  .step-badge.done { background: rgba(16,185,129,0.15); color: var(--accent-2); }
  .step-badge.active { background: rgba(34,211,153,0.2); color: var(--accent-1); border: 1px solid var(--accent-1); }
  .step-badge.pending { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"title":"3 bước kiếm tiền online","kicker":"HƯỚNG DẪN","steps":[{"label":"Bước 1","desc":"Chọn lĩnh vực bạn giỏi nhất","status":"done"},{"label":"Bước 2","desc":"Tạo nội dung trên TikTok","status":"active"},{"label":"Bước 3","desc":"Monetize & mở rộng thu nhập","status":"pending"}]}'
  >
    <div class="ambient"></div>
    <div class="title-area">
      <div class="title-kicker"></div>
      <div class="title-text"></div>
    </div>
    <div class="timeline"></div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") ? window.__hyperframes.getVariables() : {};

      var _t = v.__theme || {};
      var _r = document.getElementById('root');
      var _sv = function(n, val) { if (val) _r.style.setProperty(n, val); };
      _sv('--bg-primary', _t.bgPrimary);
      _sv('--bg-secondary', _t.bgSecondary);
      _sv('--text-primary', _t.textPrimary);
      _sv('--text-secondary', _t.textSecondary);
      _sv('--accent-1', _t.accent1);
      _sv('--accent-2', _t.accent2);
      _sv('--blob-1', _t.blob1);
      _sv('--blob-2', _t.blob2);
      _sv('--blob-3', _t.blob3);

      var setText = function(sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };

      setText(".title-kicker", v.kicker);
      setText(".title-text", v.title);

      var timeline = document.querySelector(".timeline");
      var steps = v.steps || [];
      steps.forEach(function(s) {
        var step = document.createElement("div");
        step.className = "step " + (s.status || "pending");

        var dot = document.createElement("div");
        dot.className = "step-dot";
        step.appendChild(dot);

        var label = document.createElement("div");
        label.className = "step-label";
        label.textContent = s.label || "";
        step.appendChild(label);

        var desc = document.createElement("div");
        desc.className = "step-desc";
        desc.textContent = s.desc || "";
        step.appendChild(desc);

        if (s.status) {
          var badge = document.createElement("div");
          badge.className = "step-badge " + s.status;
          var badgeTexts = { done: "HOÀN THÀNH", active: "ĐANG LÀM", pending: "SẮP TỚI" };
          badge.textContent = badgeTexts[s.status] || s.status.toUpperCase();
          step.appendChild(badge);
        }

        timeline.appendChild(step);
      });
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>
